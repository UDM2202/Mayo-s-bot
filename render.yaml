services:
  - type: web
    name: taskonbot
    runtime: node
    plan: starter            # free also works, but it sleeps and Slack commands time out while it wakes
    buildCommand: npm install && npm run build
    startCommand: node src/start.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL     # Supabase connection string (session pooler)
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_STATE_SECRET
        generateValue: true
